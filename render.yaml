services:
  - type: web
    name: api-search-clients-maps
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/places
    envVars:
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Vincule o PostgreSQL em Dashboard → Web Service → Environment → Link Database
      # O Render injeta DATABASE_URL automaticamente (usuário, senha e host).
